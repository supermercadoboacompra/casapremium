<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Premium</title>
<meta name="theme-color" content="#1f3a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa Premium">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e1d8;
  --brand:#1f3a2e;--brand-ink:#fff;--good:#1d7a46;--good-bg:#e3f3e9;--warn:#9a5b00;--warn-bg:#fdf0dc;--chip:#ece9e1;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#131412;--card:#1c1d1a;--ink:#ecebe6;--mute:#a09e97;--line:#2e2f2b;
    --brand:#9cc9ad;--brand-ink:#10231a;--good:#7fd49d;--good-bg:#173323;--warn:#f0b864;--warn-bg:#3a2a12;--chip:#282925;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.refresh{display:flex;align-items:center;gap:6px;flex:none;border:0;border-radius:999px;padding:9px 14px;background:var(--brand);color:var(--brand-ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.refresh.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:20px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px}
.search{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{flex:none;color:var(--mute)}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:17px;padding:12px 0;min-width:0}
.search button{border:0;background:none;color:var(--mute);font-size:22px;line-height:1;padding:4px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip small{opacity:.7;margin-left:4px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px 0;color:var(--mute);font-size:14px}
.bar select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
main{padding:8px 16px 40px;max-width:760px;margin:0 auto}
.list{display:grid;gap:10px}
.card{display:grid;grid-template-columns:76px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.card img{width:76px;height:76px;object-fit:contain;border-radius:10px;background:#fff}
.card .noimg{width:76px;height:76px;border-radius:10px;background:var(--chip)}
.name{font-size:15px;margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{color:var(--mute);font-size:13px;margin-top:2px}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.price b{font-size:19px}
.price s{color:var(--mute);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:12px;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--ink)}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.acts{display:flex;gap:8px;margin-top:8px}
.acts a,.acts button{font:inherit;font-size:14px;border-radius:8px;padding:7px 12px;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.acts a{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.hist{color:var(--mute);font-size:12px;margin-top:4px}
.more{display:block;width:100%;margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.empty{color:var(--mute);text-align:center;padding:40px 8px}
.best{border-color:var(--good)}
details.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
details.filters summary{cursor:pointer;font-weight:600}
#fcount{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--brand);color:var(--brand-ink);font-size:12px;text-align:center}
#fcount:empty{display:none}
.fgrid{display:grid;gap:10px;margin-top:10px}
.fgrid label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.fgrid select,.fgrid input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px}
.fgrid .chk input{width:20px;height:20px;accent-color:var(--brand)}
#freset{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px}
details.cup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
details.cup summary{cursor:pointer;font-size:14px}
details.cup ul{margin:8px 0 0;padding-left:18px;font-size:14px}
code{background:var(--chip);padding:1px 5px;border-radius:5px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 6px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tab small{font-weight:400;opacity:.8}
.big{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.big .pic{background:#fff;display:flex;justify-content:center;align-items:center;height:240px}
.big .pic img{max-width:100%;max-height:240px;object-fit:contain}
.big .body{padding:12px 14px 14px}
.big h3{font-size:13px;margin:0 0 4px;color:var(--good);text-transform:none}
.big .name{-webkit-line-clamp:3;font-size:16px;font-weight:600}
.lines{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:14px}
.lines li{display:flex;gap:8px}
.lines li span:first-child{flex:none;width:20px;text-align:center}
.lines .now{font-size:18px;font-weight:700}
.why{margin-top:8px;font-size:14px;background:var(--good-bg);color:var(--good);border-radius:8px;padding:6px 10px}
.when{color:var(--mute);font-size:12px;margin-top:8px}
.sec{margin:18px 0 8px;font-size:17px}
.sec small{display:block;color:var(--mute);font-size:13px;font-weight:400;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mute);font-size:13px}
.chart{margin-top:10px}
.chart svg{width:100%;height:110px;display:block}
.chart .cap{display:flex;justify-content:space-between;color:var(--mute);font-size:11px}
details.more-info{margin-top:8px}
details.more-info summary{cursor:pointer;font-size:14px;color:var(--brand)}
.cupl{display:grid;gap:8px}
.cupl .stat{font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1>Casa Premium</h1><div class="sub" id="status">Carregando produtos…</div></div>
    <button id="refresh" class="refresh" aria-label="Atualizar preços">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
      Atualizar
    </button>
  </div>
  <label class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar: panela 24 thyme, batedeira…" autocomplete="off" enterkeyhint="search">
    <button id="clear" aria-label="Limpar" hidden>×</button>
  </label>
  <div class="chips" id="brands"></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="promo" aria-selected="true">Promoções <small id="npromo"></small></button>
    <button class="tab" role="tab" data-tab="todos" aria-selected="false">Produtos <small id="nall"></small></button>
  </div>
</header>
<section id="vpromo" class="view" style="padding:8px 16px 40px;max-width:760px;margin:0 auto"></section>
<div class="bar view-todos" hidden>
  <span id="count"></span>
  <select id="sort" aria-label="Ordenar">
    <option value="price">Menor preço</option>
    <option value="priceDesc">Maior preço</option>
    <option value="off">Maior desconto</option>
    <option value="name">Nome (A a Z)</option>
    <option value="low">Mais perto do menor já visto</option>
  </select>
</div>
<main class="view-todos" hidden>
  <details class="filters" id="filters">
    <summary>Filtros <span id="fcount"></span></summary>
    <div class="fgrid">
      <label>Loja<select id="fstore"><option value="">Todas as lojas</option></select></label>
      <div class="frow">
        <label>Preço de<input id="fmin" type="number" inputmode="numeric" placeholder="R$ 0"></label>
        <label>até<input id="fmax" type="number" inputmode="numeric" placeholder="sem limite"></label>
      </div>
      <label class="chk"><input type="checkbox" id="fstock" checked> Só com estoque</label>
      <label class="chk"><input type="checkbox" id="foff"> Só com desconto anunciado</label>
      <label class="chk"><input type="checkbox" id="flow"> Só no menor preço já visto</label>
      <label class="chk"><input type="checkbox" id="fthyme"> Só Le Creuset cor Thyme</label>
      <button id="freset" type="button">Limpar filtros</button>
    </div>
  </details>
  <details class="cup" id="cupbox" hidden><summary>Cupons anunciados nos sites</summary><ul id="cups"></ul></details>
  <div class="list" id="list"></div>
  <button class="more" id="more" hidden>Mostrar mais</button>
</main>
<script>
const SOURCES = [
  "https://raw.githubusercontent.com/uAbsoluuT/casapremium/dados/catalogo.json",
  "https://raw.githubusercontent.com/uAbsoluuT/casapremium/dados-pc/catalogo.json",
];
const PAGE = 40;
const $ = (id) => document.getElementById(id);
const brl = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const day = (n) => new Date(n * 86400000).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", timeZone: "UTC" });
const safeUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let ALL = [], brand = "", shown = PAGE;
const BRAND_NAME = { kitchenaid: "KitchenAid" };

async function load() {
  const res = await Promise.allSettled(SOURCES.map((u) => fetch(u + "?t=" + Date.now(), { cache: "no-store" }).then((r) => (r.ok ? r.json() : null))));
  const got = res.map((r) => (r.status === "fulfilled" ? r.value : null)).filter(Boolean);
  if (!got.length) { $("status").textContent = "Não consegui carregar a lista agora. Tente de novo em alguns minutos."; return; }
  ALL = got.flatMap((g) => g.items).map((r) => ({ ...r, u: safeUrl(r.u), i: safeUrl(r.i) })).filter((r) => r.u).map((r) => {
    const eff = r.x && r.x < r.p ? r.x : r.p;
    // "Karsten (vendido por Karsten IO.)" vira só "Karsten"
    const m = r.l.match(/^(.+?) \(vendido por (.+)\)$/);
    r.store = m ? m[1] : r.l;
    r.seller = m && !norm(m[2]).startsWith(norm(m[1])) && !/infracommerce/i.test(m[2]) ? m[2] : "";
    // mesma marca escrita diferente ("Kitchenaid" e "KitchenAid") vira um filtro só
    const bk = norm(r.b);
    if (bk) r.b = (BRAND_NAME[bk] ||= r.b);
    return { ...r, eff, thyme: /creuset/i.test(r.b) && /thyme|tomilho/i.test(r.n + " " + r.u), off: r.d && r.d > r.p ? (r.d - r.p) / r.d : 0, key: norm(`${r.n} ${r.b} ${r.l}`) };
  });
  // Preço absurdo de vendedor parceiro (ex.: cafeteira a R$ 242 mil): fora se passar de 30x a mediana da marca
  const byBrand = {};
  for (const r of ALL) (byBrand[r.b] ||= []).push(r.eff);
  const med = {};
  for (const [b, v] of Object.entries(byBrand)) { v.sort((x, y) => x - y); med[b] = v[Math.floor(v.length / 2)]; }
  ALL = ALL.filter((r) => r.eff <= Math.max(30 * (med[r.b] || 0), 5000));
  const at = got.map((g) => new Date(g.at)).sort((a, b) => b - a)[0];
  const min = Math.max(0, Math.round((Date.now() - at) / 60000));
  $("status").textContent = `${ALL.length.toLocaleString("pt-BR")} produtos · preços de ${min < 1 ? "agora" : `${min} min atrás`} (${at.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })})`;
  const cups = got.flatMap((g) => g.cupons || []);
  CUPS = cups;
  const seenP = new Set();
  PROMOS = got.flatMap((g) => g.promos || []).map((x) => ({ ...x, u: safeUrl(x.u), i: safeUrl(x.i) })).filter((x) => x.u)
    .sort((a, b) => b.t.localeCompare(a.t)).filter((x) => { const k = x.u + "|" + x.p; return !seenP.has(k) && seenP.add(k); });
  // produtos avisados antes de existir o registro de promoções (vem do último aviso guardado em cada produto)
  for (const r of ALL) if (r.w && r.z && Date.parse(r.w) >= Date.now() - 14 * 86400000 && !PROMOS.some((x) => x.u === r.u))
    PROMOS.push({ t: r.w + "T12:00:00Z", n: r.n, b: r.b, u: r.u, i: r.i, l: r.l, p: r.z, x: 0, d: r.d, e: 0, q: r.q, r: 0, m: r.m, c: r.c, f: r.s, g: Math.max(0, (r.h || []).length - 1), y: ["queda avisada no Telegram"], o: r.o || [] });
  PROMOS.sort((a, b) => b.t.localeCompare(a.t));
  $("npromo").textContent = PROMOS.length ? `(${PROMOS.length})` : "";
  $("nall").textContent = `(${ALL.length.toLocaleString("pt-BR")})`;
  if (cups.length) {
    $("cupbox").hidden = false;
    $("cups").innerHTML = cups.map((c) => `<li><b>${esc(c.l)}</b>: ${[...c.c.map((k) => `<code>${esc(k)}</code>`), esc(c.x)].filter(Boolean).join(" · ")}</li>`).join("");
  }
  const stores = [...new Set(ALL.map((r) => r.store))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  const cur = $("fstore").value;
  $("fstore").innerHTML = `<option value="">Todas as lojas</option>` + stores.map((l) => `<option${l === cur ? " selected" : ""}>${esc(l)}</option>`).join("");
  drawBrands();
  drawTab();
}

function drawBrands() {
  const count = {};
  for (const r of ALL) if (r.b) count[r.b] = (count[r.b] || 0) + 1;
  const list = Object.entries(count).sort((a, b) => b[1] - a[1]);
  $("brands").innerHTML = [["", ALL.length], ...list]
    .map(([b, n]) => `<button class="chip" data-b="${esc(b)}" aria-pressed="${b === brand}">${esc(b || "Todas")}<small>${n}</small></button>`).join("");
}

function filtered() {
  const words = norm($("q").value).split(/\s+/).filter(Boolean);
  const store = $("fstore").value, min = +$("fmin").value || 0, max = +$("fmax").value || Infinity;
  const stock = $("fstock").checked, off = $("foff").checked, low = $("flow").checked, thyme = $("fthyme").checked;
  $("fcount").textContent = [store, min, max !== Infinity, !stock, off, low, thyme].filter(Boolean).length || "";
  let list = ALL.filter((r) => (!brand || r.b === brand) && words.every((w) => r.key.includes(w))
    && (!store || r.store === store) && r.eff >= min && r.eff <= max && (!stock || r.a)
    && (!off || r.off >= 0.05) && (!low || (r.c > r.m && r.p <= r.m)) && (!thyme || r.thyme));
  const s = $("sort").value;
  if (s === "priceDesc") list.sort((a, b) => b.eff - a.eff);
  else if (s === "name") list.sort((a, b) => a.n.localeCompare(b.n, "pt-BR"));
  else if (s === "off") list.sort((a, b) => b.off - a.off || a.eff - b.eff);
  else if (s === "low") list.sort((a, b) => a.p / a.m - b.p / b.m || a.eff - b.eff);
  else list.sort((a, b) => b.a - a.a || a.eff - b.eff);
  return list;
}

function card(r, cheapest) {
  const tags = [];
  if (!r.a) tags.push(`<span class="tag warn">Sem estoque</span>`);
  if (cheapest) tags.push(`<span class="tag good">Mais barato da busca</span>`);
  if (r.c > r.m && r.p <= r.m) tags.push(`<span class="tag good">Menor preço já visto</span>`);
  if (r.off >= 0.05) tags.push(`<span class="tag">−${Math.round(r.off * 100)}% anunciado</span>`);
  if (/creuset/i.test(r.b) && /thyme|tomilho/i.test(r.n + " " + r.u)) tags.push(`<span class="tag">Cor Thyme</span>`);
  const pix = r.x && r.x < r.p ? `<span>${brl(r.x)} no Pix</span>` : "";
  const hist = r.c > r.m
    ? `Desde ${day(r.s)}: menor ${brl(r.m)} · maior ${brl(r.c)}`
    : `Acompanhado desde ${day(r.s)} · preço sem mudança`;
  const img = r.i ? `<img src="${esc(r.i)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg'}))">` : `<div class="noimg"></div>`;
  return `<article class="card${cheapest ? " best" : ""}">${img}<div>
    <p class="name">${esc(r.n)}</p>
    <div class="meta">${esc(r.b)}${r.b ? " · " : ""}<b>${esc(r.store)}</b>${r.seller ? ` · vendido por ${esc(r.seller)}` : ""}</div>
    <div class="price"><b>${brl(r.p)}</b>${pix}${r.d > r.p ? `<s>${brl(r.d)}</s>` : ""}</div>
    <div class="hist">${hist}</div>
    ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
    <details class="more-info"><summary>Ver todos os detalhes e o gráfico</summary>${moreInfo(r)}</details>
    <div class="acts"><a href="${esc(r.u)}" target="_blank" rel="noopener">Ver na loja</a><button data-cmp="${esc(r.n)}">Comparar lojas</button></div>
  </div></article>`;
}

function moreInfo(r) {
  const o = fromItem(r, "");
  const L = [];
  if (o.prev) L.push(`<li><span>⏪</span><span>Antes: ${brl(o.prev)}${pctTxt(o.prev, o.p)}</span></li>`);
  if (o.usual) L.push(`<li><span>📊</span><span>Preço padrão (30 dias): ${brl(o.usual)}${pctTxt(o.usual, o.p)}</span></li>`);
  if (o.prevMin) L.push(`<li><span>🏷️</span><span>Menor preço antes deste: ${brl(o.prevMin)}</span></li>`);
  L.push(`<li><span>🔁</span><span>Mudanças de preço registradas: ${o.changes}</span></li>`);
  if (r.w) L.push(`<li><span>📉</span><span>Último aviso de queda: ${new Date(r.w + "T12:00:00Z").toLocaleDateString("pt-BR")}${r.z ? ` a ${brl(r.z)}` : ""}</span></li>`);
  if (o.pixTxt) L.push(`<li><span>💠</span><span>Site anuncia: ${esc(o.pixTxt)}</span></li>`);
  for (const k of o.coupons) L.push(`<li><span>🎟️</span><span>Cupom: <code>${esc(k.c)}</code>${k.t ? ` (${esc(k.t)})` : ""}</span></li>`);
  return `<ul class="lines">${L.join("")}</ul>${chart(o.h, o.p) || `<div class="when">O gráfico aparece quando o preço mudar.</div>`}`;
}

function render() {
  const list = filtered();
  const q = $("q").value.trim();
  $("clear").hidden = !q;
  $("count").textContent = `${list.length.toLocaleString("pt-BR")} ${list.length === 1 ? "produto" : "produtos"}`;
  const cheapest = q && $("sort").value === "price" ? list.find((r) => r.a) : null;
  $("list").innerHTML = list.length
    ? list.slice(0, shown).map((r) => card(r, r === cheapest && list.length > 1)).join("")
    : `<div class="empty">Nada encontrado${q ? ` para “${esc(q)}”` : ""}. Tente menos palavras.</div>`;
  $("more").hidden = list.length <= shown;
}

// "Comparar lojas": busca pelas palavras que identificam a peça (tira cor e palavras genéricas)
const STOP = new Set("de da do das dos com para e em a o the".split(" "));
function compareQuery(name) {
  return norm(name).replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter((w) => w.length > 1 && !STOP.has(w)).slice(0, 5).join(" ");
}

let t;
$("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { shown = PAGE; drawTab(); }, 150); });
$("clear").addEventListener("click", () => { $("q").value = ""; shown = PAGE; drawTab(); $("clear").hidden = true; $("q").focus(); });
$("sort").addEventListener("change", () => { shown = PAGE; render(); });
for (const id of ["fstore", "fmin", "fmax", "fstock", "foff", "flow", "fthyme"])
  $(id).addEventListener(id.startsWith("fm") ? "input" : "change", () => { shown = PAGE; render(); });
$("freset").addEventListener("click", () => {
  $("fstore").value = ""; $("fmin").value = ""; $("fmax").value = "";
  $("fstock").checked = true; $("foff").checked = $("flow").checked = $("fthyme").checked = false;
  shown = PAGE; render();
});
$("more").addEventListener("click", () => { shown += PAGE; render(); });
$("brands").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  brand = b.dataset.b; shown = PAGE; drawBrands(); drawTab();
});
$("list").addEventListener("click", (e) => {
  const b = e.target.closest("[data-cmp]"); if (!b) return;
  $("q").value = compareQuery(b.dataset.cmp); brand = ""; $("sort").value = "price"; shown = PAGE;
  drawBrands(); render(); window.scrollTo({ top: 0, behavior: "smooth" });
});
// Atualizar: busca a lista mais nova (o robô lê as lojas sozinho a cada ~5 min)
async function refresh() {
  const b = $("refresh");
  if (b.classList.contains("busy")) return;
  b.classList.add("busy");
  try { await load(); } finally { b.classList.remove("busy"); }
}
$("refresh").addEventListener("click", refresh);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(() => { if (!document.hidden) refresh(); }, 3 * 60000);
// ---------- Promoções (mesmo conteúdo do Telegram: foto + texto completo) ----------
let PROMOS = [], CUPS = [], tab = "promo";
const TODAY = () => Math.floor(Date.now() / 86400000);
const pctTxt = (from, p) => (from > p ? ` (−${Math.round(((from - p) / from) * 100)}%)` : "");
// Gráfico do preço: degraus de cada mudança até hoje
function chart(h, p) {
  if (!h || h.length < 2) return "";
  const pts = h.concat([[TODAY(), p]]);
  const x0 = pts[0][0], x1 = Math.max(pts[pts.length - 1][0], x0 + 1);
  const ys = pts.map((q) => q[1]), lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const X = (d) => 4 + ((d - x0) / (x1 - x0)) * 292, Y = (v) => 8 + (1 - (v - lo) / span) * 84;
  let d = `M${X(pts[0][0])},${Y(pts[0][1])}`;
  for (let i = 1; i < pts.length; i++) d += ` H${X(pts[i][0])} V${Y(pts[i][1])}`;
  return `<div class="chart"><svg viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="Histórico de preço">
    <line x1="0" x2="300" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--good)" stroke-dasharray="3 3" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="${d}" fill="none" stroke="var(--brand)" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg>
    <div class="cap"><span>${day(x0)} · ${brl(pts[0][1])}</span><span>menor ${brl(lo)} · maior ${brl(hi)}</span><span>hoje</span></div></div>`;
}

function cupsFor(store) {
  const c = CUPS.find((k) => norm(k.l) === norm(store));
  if (!c) return { codes: [], pix: "" };
  return { codes: c.c.map((code, i) => ({ c: code, t: (c.t || [])[i] || "" })), pix: c.x || "" };
}

// Card grande: foto em cima, todas as linhas do alerta embaixo
function bigCard(o) {
  const L = [];
  L.push(`<li class="now"><span>💰</span><span>Agora: ${brl(o.p)}</span></li>`);
  if (o.x && o.x < o.p) L.push(`<li><span>💠</span><span>No Pix: ${brl(o.x)}</span></li>`);
  if (o.prev) L.push(`<li><span>⏪</span><span>Antes: ${brl(o.prev)}${o.prev === o.p ? " (sem mudança)" : pctTxt(o.prev, o.p)}</span></li>`);
  if (o.usual) L.push(`<li><span>📊</span><span>Preço padrão (30 dias): ${brl(o.usual)}${pctTxt(o.usual, o.p)}</span></li>`);
  if (o.prevMin) L.push(`<li><span>🏷️</span><span>Menor preço antes deste: ${brl(o.prevMin)}</span></li>`);
  if (o.since && o.max) L.push(`<li><span>🗓️</span><span>Desde ${day(o.since)}: menor ${brl(o.min)} · maior ${brl(o.max)}</span></li>`);
  if (o.lp && o.lp > o.p) L.push(`<li><span>🧾</span><span>"De" da loja: ${brl(o.lp)}${pctTxt(o.lp, o.p)}</span></li>`);
  if (o.changes) L.push(`<li><span>🔁</span><span>Mudanças de preço registradas: ${o.changes}</span></li>`);
  L.push(`<li><span>🏪</span><span>Loja: ${esc(o.store)}</span></li>`);
  if (o.pixTxt && !o.x) L.push(`<li><span>💠</span><span>Site anuncia: ${esc(o.pixTxt)}</span></li>`);
  for (const k of o.coupons || []) L.push(`<li><span>🎟️</span><span>Cupom: <code>${esc(k.c)}</code>${k.t ? ` (${esc(k.t)})` : ""}</span></li>`);
  const img = o.i ? `<div class="pic"><img src="${esc(o.i)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></div>` : "";
  return `<article class="big">${img}<div class="body">
    <h3>${o.title}${o.b ? ` · ${esc(o.b)}` : ""}</h3>
    <p class="name">${esc(o.n)}</p>
    ${o.notes?.length ? `<div class="tags">${o.notes.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
    <ul class="lines">${L.join("")}</ul>
    ${o.why?.length ? `<div class="why">✅ Por quê: ${esc(o.why.join("; "))}</div>` : ""}
    ${chart(o.h, o.p)}
    ${o.when ? `<div class="when">${esc(o.when)}</div>` : ""}
    <div class="acts"><a href="${esc(o.u)}" target="_blank" rel="noopener">Ver na loja</a><button data-cmp="${esc(o.n)}">Comparar lojas</button></div>
  </div></article>`;
}

// produto da lista vira card completo
function fromItem(r, title, why = []) {
  const h = r.h || [];
  const prevs = h.slice(0, -1).map((q) => q[1]);
  const c = cupsFor(r.store);
  return {
    title, why, n: r.n, b: r.b, u: r.u, i: r.i, store: r.l, p: r.p, x: r.x, lp: r.d, h, notes: r.o || [],
    prev: h.length > 1 ? h[h.length - 2][1] : 0, usual: r.q, prevMin: prevs.length ? Math.min(...prevs) : 0,
    min: r.m, max: r.c, since: r.s, changes: Math.max(0, h.length - 1), coupons: c.codes, pixTxt: c.pix,
  };
}

function fromPromo(x) {
  const item = ALL.find((r) => r.u === x.u);
  const when = new Date(x.t);
  return {
    title: "📉 Baixou o preço", why: x.y, n: x.n, b: x.b, u: x.u, i: x.i, store: x.l, p: x.p, x: x.x, lp: x.d,
    prev: x.e, usual: x.q, prevMin: x.r, min: x.m, max: x.c, since: x.f, changes: x.g, notes: x.o || [],
    coupons: (x.cp || []).map((k) => ({ c: k.c, t: k.t })), pixTxt: x.cx, h: item?.h,
    when: `Avisado em ${when.toLocaleDateString("pt-BR")} às ${when.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}` +
      (item && item.p !== x.p ? ` · hoje está ${brl(item.p)}${item.a ? "" : " (sem estoque)"}` : item && !item.a ? " · hoje sem estoque" : ""),
  };
}

function drawPromo() {
  const words = norm($("q").value).split(/\s+/).filter(Boolean);
  $("clear").hidden = !words.length;
  const list = PROMOS.filter((x) => (!brand || x.b === brand) && words.every((w) => norm(`${x.n} ${x.b} ${x.l}`).includes(w)));
  $("vpromo").innerHTML = `<h2 class="sec">Promoções dos últimos 14 dias (${list.length})
      <small>Cada queda de preço que o robô avisou no Telegram, com foto e todos os detalhes. Mais nova primeiro.</small></h2>` +
    (list.length ? `<div class="list">${list.map((x) => bigCard(fromPromo(x))).join("")}</div>`
      : `<div class="empty">Nenhuma queda de preço registrada${brand ? ` para ${esc(brand)}` : ""} ainda. Assim que o robô avisar no Telegram, aparece aqui também.</div>`);
}

function setTab(t) {
  tab = t;
  for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", String(b.dataset.tab === t));
  $("vpromo").hidden = t !== "promo";
  for (const el of document.querySelectorAll(".view-todos")) el.hidden = t !== "todos";
  drawTab();
  try { localStorage.setItem("cp-tab", t); } catch {}
}
function drawTab() {
  if (!ALL.length) return;
  if (tab === "promo") drawPromo();
  else render();
}
document.querySelector(".tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab"); if (b) { setTab(b.dataset.tab); window.scrollTo({ top: 0 }); }
});
for (const id of ["vpromo"])
  $(id).addEventListener("click", (e) => {
    const b = e.target.closest("[data-cmp]"); if (!b) return;
    $("q").value = compareQuery(b.dataset.cmp); brand = ""; $("sort").value = "price"; shown = PAGE;
    drawBrands(); setTab("todos"); window.scrollTo({ top: 0, behavior: "smooth" });
  });

try { const saved = localStorage.getItem("cp-tab"); if (saved === "promo" || saved === "todos") setTab(saved); } catch {}
load();
</script>
</body>
