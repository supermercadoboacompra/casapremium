<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Premium</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141614" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa Premium">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2;--surface:#fff;--sunk:#eceee9;--ink:#1a1d1a;--ink2:#3b403b;--mute:#6b726b;--line:#e1e3de;
  --thyme:#56623f;--thyme-ink:#fff;--thyme-soft:#e9ede1;
  --drop:#a8232f;--drop-soft:#f8e6e7;--bug:#8a5a00;--bug-soft:#fbefd6;
  --radius-lg:18px;--radius:12px;--radius-sm:8px;
  --shadow:0 1px 2px rgba(26,29,26,.05),0 8px 24px -12px rgba(26,29,26,.12);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141614;--surface:#1c1f1c;--sunk:#252925;--ink:#eceee9;--ink2:#cfd3cc;--mute:#9aa199;--line:#2d322d;
    --thyme:#a9b98a;--thyme-ink:#151a10;--thyme-soft:#262e1e;
    --drop:#ff8a8f;--drop-soft:#3a1d20;--bug:#f2c36b;--bug-soft:#3a2d12;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--thyme);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}

/* ---------- topo ---------- */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px 0 10px}
.logo{display:flex;align-items:center;gap:10px;flex:none;text-decoration:none;color:inherit}
.logo svg{width:34px;height:34px;border-radius:10px}
.logo b{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1}
.status{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status i{flex:none;width:7px;height:7px;border-radius:50%;background:#3f9d5c;box-shadow:0 0 0 3px color-mix(in srgb,#3f9d5c 22%,transparent)}
.status.err i{background:var(--drop);box-shadow:none}
.top .grow{flex:1}
.iconbtn{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.iconbtn:hover{background:var(--sunk)}
.iconbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search{display:flex;align-items:center;gap:10px;background:var(--sunk);border:1px solid transparent;border-radius:var(--radius);padding:0 14px;transition:border-color .15s,background .15s}
.search:focus-within{background:var(--surface);border-color:var(--thyme)}
.search svg{flex:none;color:var(--mute)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:16px;padding:12px 0;min-width:0}
.search input::-webkit-search-cancel-button{display:none}
.search button{border:0;background:none;color:var(--mute);font-size:22px;line-height:1;padding:4px;cursor:pointer}
.nav{display:flex;align-items:center;gap:12px;padding:10px 0 12px}
.seg{flex:none;display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg small{font-weight:500;opacity:.75;margin-left:3px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--mute)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip small{color:var(--mute);margin-left:5px;font-weight:400}
.chip[aria-pressed=true] small{color:inherit;opacity:.7}
body.voos #brands{display:none}
@media (max-width:640px){.nav{flex-direction:column;align-items:stretch;gap:10px}.seg button{flex:1;padding:7px 6px;font-size:13.5px}.seg small{display:block;margin:0}.status{display:none}}
.paylbl{color:var(--mute);font-size:13px;margin-top:3px}
.pix span{font-weight:500;opacity:.85}
.pix.same{color:var(--mute);font-weight:500}

/* ---------- títulos de seção ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:26px 0 14px;flex-wrap:wrap}
.head h2{margin:0;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.025em}
.head p{margin:4px 0 0;color:var(--mute);font-size:14px;max-width:60ch}
.tools{display:flex;gap:8px;align-items:center}
.tools select,.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.ghost{display:flex;align-items:center;gap:6px;font-weight:600}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--thyme);color:var(--thyme-ink);font-size:12px}
.badge:empty{display:none}

/* ---------- promoções ---------- */
.promos{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));padding-bottom:48px}
.deal{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.deal .pic{position:relative;background:#fff;height:240px;display:grid;place-items:center;padding:18px;border-bottom:1px solid var(--line)}
.deal .pic img{position:absolute;inset:18px;width:calc(100% - 36px);height:calc(100% - 36px);object-fit:contain;mix-blend-mode:multiply}
.off{position:absolute;z-index:1;left:12px;top:12px;background:#b3202c;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.01em;padding:5px 10px;border-radius:var(--radius-sm)}
.off.bug{background:#8a5a00}
.ago{position:absolute;z-index:1;right:12px;top:12px;background:rgba(255,255,255,.92);color:#3b403b;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid #e1e3de}
.deal .body{display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px;flex:1}
.who{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px}
.who b{color:var(--ink2);font-weight:600}
.pname{margin:0;font-size:16px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.money{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.now{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.was{color:var(--mute);font-size:14px;text-decoration:line-through;margin-top:4px}
.pix{color:var(--thyme);font-size:14px;font-weight:600;margin-top:4px}
.spark{flex:none;width:96px;height:38px;color:var(--thyme)}
.why{font-size:14px;color:var(--ink2);background:var(--sunk);border-radius:var(--radius-sm);padding:8px 10px}
.bugnote{font-size:14px;color:var(--bug);background:var(--bug-soft);border-radius:var(--radius-sm);padding:8px 10px;font-weight:600}
.today{font-size:13px;color:var(--drop);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;background:var(--sunk);color:var(--ink2)}
.tag.good{background:var(--thyme-soft);color:var(--thyme)}
.tag.warn{background:var(--bug-soft);color:var(--bug)}
.tag.thyme{background:#56623f;color:#fff}
/* análise: vale ou não vale */
.verdict{border-radius:var(--radius-sm);padding:9px 11px;font-size:14px;line-height:1.4;background:var(--sunk);color:var(--ink2)}
.verdict b{display:block;font-size:13px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:2px}
.verdict ul{margin:2px 0 0;padding-left:18px}
.verdict.v1{background:var(--thyme);color:var(--thyme-ink)}
.verdict.v2{background:var(--thyme-soft);color:var(--thyme)}
.verdict.v2 ul,.verdict.v3 ul,.verdict.v4 ul{color:var(--ink2)}
.verdict.v4{background:var(--sunk);color:var(--mute)}
.verdict.vb{background:var(--bug-soft);color:var(--bug)}
.verdict.vb ul{color:var(--ink2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;margin:0 0 16px;box-shadow:var(--shadow)}
.panel .vchips{display:flex;flex-wrap:wrap;gap:6px}
.panel .tip{margin:10px 0 0;font-size:14px;color:var(--ink2)}
.panel details{margin-top:8px;font-size:14px;color:var(--ink2)}
.panel summary{cursor:pointer;color:var(--mute);font-size:13.5px}
.panel details ul{margin:6px 0 0;padding-left:18px}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.btn{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;border-radius:999px;padding:10px 14px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.pri:hover{opacity:.9;background:var(--ink)}

/* destaque: a promoção mais nova ocupa duas colunas em tela larga */
@media (min-width:760px){
  .promos .deal.feat{grid-column:span 2;flex-direction:row}
  .deal.feat .pic{height:auto;min-height:340px;width:46%;flex:none;border-bottom:0;border-right:1px solid var(--line);padding:28px}
  .deal.feat .body{padding:22px 24px}
  .deal.feat .pname{font-size:21px;-webkit-line-clamp:3;letter-spacing:-.01em}
  .deal.feat .now{font-size:40px}
  .deal.feat .spark{width:150px;height:56px}
}

/* detalhes que abrem ao tocar */
details.more{border-top:1px solid var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--ink2);list-style:none;display:flex;align-items:center;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg{transition:transform .2s;color:var(--mute)}
details.more[open] summary svg{transform:rotate(180deg)}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0;font-size:14px}
dl.facts dt{color:var(--mute)}
dl.facts dd{margin:0;text-align:right;font-weight:600}
dl.facts dd em{font-style:normal;color:var(--drop);font-weight:600;margin-left:4px}
code{font-family:inherit;font-weight:700;background:var(--thyme-soft);color:var(--thyme);padding:1px 6px;border-radius:5px;letter-spacing:.02em}
.chart{margin-top:12px}
.chart svg{width:100%;height:120px;display:block;overflow:visible}
.chart .cap{display:flex;justify-content:space-between;color:var(--mute);font-size:11.5px;margin-top:4px}
.note{color:var(--mute);font-size:13px;margin-top:8px}

/* ---------- produtos ---------- */
.layout{display:grid;gap:20px;padding-bottom:48px}
@media (min-width:980px){.layout{grid-template-columns:250px 1fr;align-items:start}.side{position:sticky;top:150px}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px}
.side h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center}
.side summary{list-style:none;cursor:pointer}
.side:not([open]) h3{margin:0}
.side h3::after{content:"";width:8px;height:8px;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(45deg);margin-left:auto}
.side[open] h3::after{transform:rotate(-135deg)}
.side h3 .badge{margin-left:8px}
.side summary::-webkit-details-marker{display:none}
.fgrid{display:grid;gap:12px}
.fgrid label{display:grid;gap:5px;font-size:13px;color:var(--mute);font-weight:500}
.fgrid select,.fgrid input[type=number]{color:var(--ink);background:var(--sunk);border:1px solid transparent;border-radius:var(--radius-sm);padding:9px 10px;width:100%;font-size:15px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .chk{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:14.5px;cursor:pointer}
.fgrid .chk input{width:18px;height:18px;accent-color:var(--thyme);margin:0}
.linkbtn{border:0;background:none;color:var(--thyme);font-weight:600;font-size:13px;cursor:pointer;padding:0}
.cupbox{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px}
.cupbox b{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-bottom:6px}
.cupbox ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.item{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.item.best{border-color:var(--thyme);box-shadow:0 0 0 1px var(--thyme)}
.item .pic{position:relative;background:#fff;aspect-ratio:1;display:grid;place-items:center;padding:14px;border-bottom:1px solid var(--line)}
.item .pic img{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);object-fit:contain;mix-blend-mode:multiply}
.item .noimg{width:48px;height:48px;border-radius:12px;background:var(--sunk)}
.item .body{display:flex;flex-direction:column;gap:6px;padding:12px;flex:1}
.item .pname{font-size:14.5px;font-weight:500}
.item .now{font-size:21px}
.item .acts{padding-top:6px}
.item .btn{padding:8px 10px;font-size:13px}
.item.off-stock .pic img{opacity:.45}
@media (max-width:560px){
  .grid{grid-template-columns:1fr;gap:10px}
  .item{display:grid;grid-template-columns:104px 1fr}
  .item .pic{aspect-ratio:auto;border-bottom:0;border-right:1px solid var(--line);padding:8px;height:100%;min-height:120px}
  .promos{grid-template-columns:1fr}
}
.route{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:0}
.route span{color:var(--mute);font-weight:600}
.dates{font-size:14px;color:var(--ink2)}
.flt .now{font-size:26px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:56px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius-lg)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.loadmore{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 22px;font-weight:600;cursor:pointer}
.skel{background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:var(--radius-lg);height:380px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <a class="logo" href="./" aria-label="Casa Premium, início">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#56623f"/><path d="M14 30 32 15l18 15v19a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M25 51V38h14v13" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>
        <b>Casa Premium</b>
      </a>
      <div class="status" id="status"><i></i><span>Carregando…</span></div>
      <div class="grow"></div>
      <button id="refresh" class="iconbtn" aria-label="Atualizar preços" title="Atualizar preços">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar produto, marca ou loja" autocomplete="off" enterkeyhint="search" aria-label="Buscar">
      <button id="clear" aria-label="Limpar busca" hidden>×</button>
    </label>
    <div class="nav">
      <div class="seg" role="tablist">
        <button role="tab" data-tab="promo" aria-selected="true">Promoções<small id="npromo"></small></button>
        <button role="tab" data-tab="ativas" aria-selected="false">Ainda valendo<small id="nativas"></small></button>
        <button role="tab" data-tab="todos" aria-selected="false">Produtos<small id="nall"></small></button>
        <button role="tab" data-tab="voos" aria-selected="false">Passagens<small id="nvoos"></small></button>
      </div>
      <div class="chips" id="brands"></div>
    </div>
  </div>
</header>

<section id="vpromo" class="wrap view">
  <div class="head"><div><h2>Promoções</h2><p>Carregando…</p></div></div>
  <div class="promos"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</section>

<section id="vvoos" class="wrap view-voos" hidden></section>

<section class="wrap view-todos" hidden>
  <div class="head">
    <div><h2 id="count">Produtos</h2><p id="countsub">Preço de hoje em cada loja acompanhada.</p></div>
    <div class="tools">
      <select id="sort" aria-label="Ordenar">
        <option value="price">Menor preço</option>
        <option value="priceDesc">Maior preço</option>
        <option value="off">Maior desconto</option>
        <option value="name">Nome (A a Z)</option>
        <option value="low">Mais perto do menor já visto</option>
      </select>
    </div>
  </div>
  <div class="layout">
    <details class="side" id="filters">
      <summary><h3>Filtros <span class="badge" id="fcount"></span></h3></summary>
      <div class="fgrid">
        <label>Loja<select id="fstore"><option value="">Todas as lojas</option></select></label>
        <div class="frow">
          <label>Preço de<input id="fmin" type="number" inputmode="numeric" placeholder="R$ 0"></label>
          <label>até<input id="fmax" type="number" inputmode="numeric" placeholder="sem limite"></label>
        </div>
        <label class="chk"><input type="checkbox" id="fstock" checked> Só com estoque</label>
        <label class="chk"><input type="checkbox" id="foff"> Só com desconto anunciado</label>
        <label class="chk"><input type="checkbox" id="flow"> Só no menor preço já visto</label>
        <label class="chk"><input type="checkbox" id="fthyme"> Só Le Creuset cor Thyme</label>
        <div><button id="freset" class="linkbtn" type="button">Limpar filtros</button></div>
      </div>
      <div class="cupbox" id="cupbox" hidden><b>Cupons anunciados nos sites</b><ul id="cups"></ul></div>
    </details>
    <div>
      <div class="grid" id="list"></div>
      <button class="loadmore" id="more" hidden>Mostrar mais produtos</button>
    </div>
  </div>
</section>

<script>
const SOURCES = [
  "https://raw.githubusercontent.com/supermercadoboacompra/casapremium/dados/catalogo.json",
  "https://raw.githubusercontent.com/supermercadoboacompra/casapremium/dados-pc/catalogo.json",
];
const PAGE = 48;
const $ = (id) => document.getElementById(id);
const brl = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const day = (n) => new Date(n * 86400000).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", timeZone: "UTC" });
const safeUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (from, p) => (from > p ? Math.round(((from - p) / from) * 100) : 0);
const CHEV = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;
const EXT = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>`;
const CMP = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h12"/><path d="m13 4 3 3-3 3"/><path d="M20 17H8"/><path d="m11 14-3 3 3 3"/></svg>`;

let ALL = [], brand = "", shown = PAGE;
const BRAND_NAME = { kitchenaid: "KitchenAid" };

function setStatus(txt, err) {
  $("status").className = "status" + (err ? " err" : "");
  $("status").innerHTML = `<i></i><span>${esc(txt)}</span>`;
}

async function load() {
  const res = await Promise.allSettled(SOURCES.map((u) => fetch(u + "?t=" + Date.now(), { cache: "no-store" }).then((r) => (r.ok ? r.json() : null))));
  const got = res.map((r) => (r.status === "fulfilled" ? r.value : null)).filter(Boolean);
  if (!got.length) {
    setStatus("Sem conexão com a lista", true);
    if (!ALL.length) $("vpromo").innerHTML = `<div class="head"><div><h2>Promoções</h2></div></div><div class="empty"><b>A lista não carregou</b>Confira a internet e toque em atualizar, no canto de cima.</div>`;
    return;
  }
  ALL = got.flatMap((g) => g.items).map((r) => ({ ...r, u: safeUrl(r.u), i: safeUrl(r.i) })).filter((r) => r.u).map((r) => {
    const eff = r.x && r.x < r.p ? r.x : r.p;
    // "Karsten (vendido por Karsten IO.)" vira só "Karsten"
    const m = r.l.match(/^(.+?) \(vendido por (.+)\)$/);
    r.store = m ? m[1] : r.l;
    r.seller = m && !norm(m[2]).startsWith(norm(m[1])) && !/infracommerce/i.test(m[2]) ? m[2] : "";
    // mesma marca escrita diferente ("Kitchenaid" e "KitchenAid") vira um filtro só
    const bk = norm(r.b);
    if (bk) r.b = (BRAND_NAME[bk] ||= r.b);
    return { ...r, eff, thyme: /creuset/i.test(r.b) && /thyme|tomilho/i.test(r.n + " " + r.u), off: r.d && r.d > r.p ? (r.d - r.p) / r.d : 0, key: norm(`${r.n} ${r.b} ${r.l}`) };
  });
  // Preço absurdo de vendedor parceiro (ex.: cafeteira a R$ 242 mil): fora se passar de 30x a mediana da marca
  const byBrand = {};
  for (const r of ALL) (byBrand[r.b] ||= []).push(r.eff);
  const med = {};
  for (const [b, v] of Object.entries(byBrand)) { v.sort((x, y) => x - y); med[b] = v[Math.floor(v.length / 2)]; }
  ALL = ALL.filter((r) => r.eff <= Math.max(30 * (med[r.b] || 0), 5000));
  const at = got.map((g) => new Date(g.at)).sort((a, b) => b - a)[0];
  const min = Math.max(0, Math.round((Date.now() - at) / 60000));
  setStatus(`Preços de ${min < 1 ? "agora" : min < 60 ? `${min} min atrás` : at.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`);
  const cups = got.flatMap((g) => g.cupons || []);
  CUPS = cups;
  const seenP = new Set();
  PROMOS = got.flatMap((g) => g.promos || []).map((x) => ({ ...x, u: safeUrl(x.u), i: safeUrl(x.i) })).filter((x) => x.u)
    .sort((a, b) => b.t.localeCompare(a.t)).filter((x) => { const k = x.u + "|" + x.p; return !seenP.has(k) && seenP.add(k); });
  // produtos avisados antes de existir o registro de promoções (vem do último aviso guardado em cada produto)
  for (const r of ALL) if (r.w && r.z && Date.parse(r.w) >= Date.now() - 14 * 86400000 && !PROMOS.some((x) => x.u === r.u))
    PROMOS.push({ t: r.w + "T12:00:00Z", n: r.n, b: r.b, u: r.u, i: r.i, l: r.l, p: r.z, x: 0, d: r.d, e: 0, q: r.q, r: 0, m: r.m, c: r.c, f: r.s, g: Math.max(0, (r.h || []).length - 1), y: ["queda avisada no Telegram"], o: r.o || [] });
  PROMOS.sort((a, b) => b.t.localeCompare(a.t));
  BYURL = new Map(ALL.map((r) => [r.u, r]));
  const seenU = new Set();
  analyze(PROMOS);
  ACTIVE = PROMOS.filter((x) => !seenU.has(x.u) && seenU.add(x.u) && stillOn(x));
  VOOS = got.flatMap((g) => g.voos || []).map((v) => ({ ...v, u: safeUrl(v.u), g: safeUrl(v.g) }));
  VOOSON = got.some((g) => g.voosOn);
  $("nvoos").textContent = VOOS.length || "";
  $("npromo").textContent = PROMOS.length ? PROMOS.length : "";
  $("nativas").textContent = ACTIVE.length;
  $("nall").textContent = ALL.length.toLocaleString("pt-BR");
  if (cups.length) {
    $("cupbox").hidden = false;
    $("cups").innerHTML = cups.map((c) => `<li><b style="display:inline;color:var(--ink)">${esc(c.l)}</b> ${[...c.c.map((k) => `<code>${esc(k)}</code>`), esc(c.x)].filter(Boolean).join(" ")}</li>`).join("");
  }
  const stores = [...new Set(ALL.map((r) => r.store))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  const cur = $("fstore").value;
  $("fstore").innerHTML = `<option value="">Todas as lojas</option>` + stores.map((l) => `<option${l === cur ? " selected" : ""}>${esc(l)}</option>`).join("");
  drawBrands();
  drawTab();
}

function drawBrands() {
  const count = {};
  for (const r of ALL) if (r.b) count[r.b] = (count[r.b] || 0) + 1;
  const list = Object.entries(count).sort((a, b) => b[1] - a[1]);
  $("brands").innerHTML = [["", ALL.length], ...list]
    .map(([b, n]) => `<button class="chip" data-b="${esc(b)}" aria-pressed="${b === brand}">${esc(b || "Todas as marcas")}<small>${n.toLocaleString("pt-BR")}</small></button>`).join("");
}

function filtered() {
  const words = norm($("q").value).split(/\s+/).filter(Boolean);
  const store = $("fstore").value, min = +$("fmin").value || 0, max = +$("fmax").value || Infinity;
  const stock = $("fstock").checked, off = $("foff").checked, low = $("flow").checked, thyme = $("fthyme").checked;
  $("fcount").textContent = [store, min, max !== Infinity, !stock, off, low, thyme].filter(Boolean).length || "";
  let list = ALL.filter((r) => (!brand || r.b === brand) && words.every((w) => r.key.includes(w))
    && (!store || r.store === store) && r.eff >= min && r.eff <= max && (!stock || r.a)
    && (!off || r.off >= 0.05) && (!low || (r.c > r.m && r.p <= r.m)) && (!thyme || r.thyme));
  const s = $("sort").value;
  if (s === "priceDesc") list.sort((a, b) => b.eff - a.eff);
  else if (s === "name") list.sort((a, b) => a.n.localeCompare(b.n, "pt-BR"));
  else if (s === "off") list.sort((a, b) => b.off - a.off || a.eff - b.eff);
  else if (s === "low") list.sort((a, b) => a.p / a.m - b.p / b.m || a.eff - b.eff);
  else list.sort((a, b) => b.a - a.a || a.eff - b.eff);
  return list;
}

function who(b, l) {
  const m = String(l || "").match(/^(.+?) \(vendido por (.+)\)$/);
  const store = m ? m[1] : l, seller = m && !norm(m[2]).replace(/s/g, "").includes(norm(m[1]).replace(/s/g, "")) && !/infracommerce/i.test(m[2]) ? m[2] : "";
  const where = norm(store) === norm(b) ? "loja oficial" : store;
  return `<div class="who"><b>${esc(b)}</b><span>${esc(where)}${seller ? `, vendido por ${esc(seller)}` : ""}</span></div>`;
}
// Preço no cartão (com parcelas sem juros) e no Pix: exato da loja, ou pelo desconto anunciado no site
function pay(p, x, pi, l, was) {
  if (!(Array.isArray(pi) && Number.isInteger(pi[0]) && Number.isFinite(pi[1]))) pi = null;
  const store = String(l || "").replace(/ \(vendido por .+\)$/, "");
  let pix = x && x < p ? x : 0, calc = false;
  if (!pix) {
    const pc = parseInt((cupsFor(store).pix.match(/(\d{1,2})\s*%/) || [])[1] || "0", 10);
    if (pc) { pix = Math.round(p * (100 - pc)) / 100; calc = true; }
  }
  return `<div class="pay"><div class="now">${brl(p)}</div>
    <div class="paylbl">no cartão${pi ? `, até ${pi[0]}x de ${brl(pi[1])} sem juros` : ""}</div>
    ${pix ? `<div class="pix">${brl(pix)} no Pix <span>(−${pct(p, pix)}%${calc ? ", desconto anunciado" : ""})</span></div>` : `<div class="pix same">Pix: mesmo preço</div>`}
    ${was ? `<div class="was">antes ${brl(was)}</div>` : ""}</div>`;
}

const imgTag = (src, fallback) => src
  ? `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="${fallback}">`
  : "";

function card(r, cheapest) {
  const tags = [];
  if (!r.a) tags.push(`<span class="tag warn">Sem estoque</span>`);
  if (cheapest) tags.push(`<span class="tag good">Mais barato da busca</span>`);
  if (r.c > r.m && r.p <= r.m) tags.push(`<span class="tag good">Menor preço já visto</span>`);
  if (r.off >= 0.05) tags.push(`<span class="tag">${Math.round(r.off * 100)}% abaixo do "de"</span>`);
  if (r.thyme) tags.push(`<span class="tag thyme">Cor Thyme</span>`);
  const pix = r.x && r.x < r.p ? `<div class="pix">${brl(r.x)} no Pix</div>` : "";
  const img = imgTag(r.i, "this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg'}))") || `<div class="noimg"></div>`;
  return `<article class="item${cheapest ? " best" : ""}${r.a ? "" : " off-stock"}"><div class="pic">${img}</div><div class="body">
    ${who(r.b, r.l)}
    <p class="pname">${esc(r.n)}</p>
    ${pay(r.p, r.x, r.pi, r.l, r.d > r.p ? r.d : 0)}
    ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
    <details class="more"><summary>Histórico de preço ${CHEV}</summary>${moreInfo(r)}</details>
    <div class="acts"><a class="btn pri" href="${esc(r.u)}" target="_blank" rel="noopener">Ver na loja</a><button class="btn" data-cmp="${esc(r.n)}" aria-label="Comparar lojas">${CMP}Comparar</button></div>
  </div></article>`;
}

function facts(o, full) {
  const F = [];
  const row = (k, v) => F.push(`<dt>${k}</dt><dd>${v}</dd>`);
  const pc = (from) => (pct(from, o.p) ? `<em>−${pct(from, o.p)}%</em>` : "");
  if (o.prev && o.prev !== o.p) row("Antes", `${brl(o.prev)}${pc(o.prev)}`);
  if (o.usual) row("Preço de costume (30 dias)", `${brl(o.usual)}${pc(o.usual)}`);
  if (o.prevMin) row("Menor antes deste", brl(o.prevMin));
  if (o.since && o.max) row(`Desde ${day(o.since)}`, `${brl(o.min)} a ${brl(o.max)}`);
  if (full && o.lp && o.lp > o.p) row(`"De" da loja`, `${brl(o.lp)}${pc(o.lp)}`);
  row("Mudanças de preço", String(o.changes || 0));
  if (o.lastWarn) row("Último aviso de queda", o.lastWarn);
  if (o.pixTxt && !o.x) row("Site anuncia", esc(o.pixTxt));
  for (const k of o.coupons || []) row("Cupom", `<code>${esc(k.c)}</code>${k.t ? ` ${esc(k.t)}` : ""}`);
  return `<dl class="facts">${F.join("")}</dl>`;
}

function moreInfo(r) {
  const o = fromItem(r);
  return facts(o, false) + (chart(o.h, o.p) || `<div class="note">O gráfico aparece quando o preço mudar.</div>`);
}

function render() {
  const list = filtered();
  const q = $("q").value.trim();
  $("clear").hidden = !q;
  $("count").textContent = `${list.length.toLocaleString("pt-BR")} ${list.length === 1 ? "produto" : "produtos"}`;
  $("countsub").textContent = q ? `Resultado para “${q}”${brand ? ` em ${brand}` : ""}.` : brand ? `Todos os produtos ${brand} acompanhados.` : "Preço de hoje em cada loja acompanhada.";
  const cheapest = q && $("sort").value === "price" ? list.find((r) => r.a) : null;
  $("list").innerHTML = list.length
    ? list.slice(0, shown).map((r) => card(r, r === cheapest && list.length > 1)).join("")
    : `<div class="empty"><b>Nenhum produto encontrado</b>${q ? `Tente menos palavras do que “${esc(q)}” ou limpe os filtros.` : "Limpe os filtros para ver todos."}</div>`;
  $("more").hidden = list.length <= shown;
}

// "Comparar lojas": busca pelas palavras que identificam a peça (tira cor e palavras genéricas)
const STOP = new Set("de da do das dos com para e em a o the".split(" "));
function compareQuery(name) {
  return norm(name).replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter((w) => w.length > 1 && !STOP.has(w)).slice(0, 5).join(" ");
}
function compare(name) {
  $("q").value = compareQuery(name); brand = ""; $("sort").value = "price"; shown = PAGE;
  drawBrands(); setTab("todos"); window.scrollTo({ top: 0, behavior: "smooth" });
}

let t;
$("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { shown = PAGE; drawTab(); }, 150); });
$("clear").addEventListener("click", () => { $("q").value = ""; shown = PAGE; drawTab(); $("clear").hidden = true; $("q").focus(); });
$("sort").addEventListener("change", () => { shown = PAGE; render(); });
for (const id of ["fstore", "fmin", "fmax", "fstock", "foff", "flow", "fthyme"])
  $(id).addEventListener(id.startsWith("fm") ? "input" : "change", () => { shown = PAGE; render(); });
$("freset").addEventListener("click", () => {
  $("fstore").value = ""; $("fmin").value = ""; $("fmax").value = "";
  $("fstock").checked = true; $("foff").checked = $("flow").checked = $("fthyme").checked = false;
  shown = PAGE; render();
});
$("more").addEventListener("click", () => { shown += PAGE; render(); });
$("brands").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  brand = b.dataset.b; shown = PAGE; drawBrands(); drawTab();
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-cmp]"); if (b) compare(b.dataset.cmp);
});
// Atualizar: busca a lista mais nova (o robô lê as lojas sozinho a cada ~5 min)
async function refresh() {
  const b = $("refresh");
  if (b.classList.contains("busy")) return;
  b.classList.add("busy");
  try { await load(); } finally { b.classList.remove("busy"); }
}
$("refresh").addEventListener("click", refresh);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(() => { if (!document.hidden) refresh(); }, 3 * 60000);

// ---------- Promoções (mesmo conteúdo do Telegram) ----------
let PROMOS = [], CUPS = [], ACTIVE = [], BYURL = new Map(), tab = "promo";
const TODAY = () => Math.floor(Date.now() / 86400000);

function steps(h, p) {
  if (!h || h.length < 2) return null;
  const pts = h.concat([[TODAY(), p]]);
  const x0 = pts[0][0], x1 = Math.max(pts[pts.length - 1][0], x0 + 1);
  const ys = pts.map((q) => q[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  return { pts, x0, x1, lo, hi, span: hi - lo || 1 };
}
// Gráfico do preço: degraus de cada mudança até hoje
function chart(h, p) {
  const s = steps(h, p); if (!s) return "";
  const X = (d) => ((d - s.x0) / (s.x1 - s.x0)) * 300, Y = (v) => 10 + (1 - (v - s.lo) / s.span) * 80;
  let d = `M0,${Y(s.pts[0][1])}`;
  for (let i = 1; i < s.pts.length; i++) d += ` H${X(s.pts[i][0])} V${Y(s.pts[i][1])}`;
  d += " H300";
  return `<div class="chart"><svg viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="Histórico de preço">
    <path d="${d} V100 H0 Z" fill="var(--thyme)" opacity=".1"/>
    <line x1="0" x2="300" y1="${Y(s.lo)}" y2="${Y(s.lo)}" stroke="var(--thyme)" stroke-dasharray="3 4" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".7"/>
    <path d="${d}" fill="none" stroke="var(--thyme)" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
    <div class="cap"><span>${day(s.x0)}</span><span>menor ${brl(s.lo)} · maior ${brl(s.hi)}</span><span>hoje</span></div></div>`;
}
// Mini gráfico ao lado do preço da promoção
function spark(h, p) {
  const s = steps(h, p); if (!s) return "";
  const X = (d) => 2 + ((d - s.x0) / (s.x1 - s.x0)) * 92, Y = (v) => 4 + (1 - (v - s.lo) / s.span) * 30;
  let d = `M2,${Y(s.pts[0][1])}`;
  for (let i = 1; i < s.pts.length; i++) d += ` H${X(s.pts[i][0])} V${Y(s.pts[i][1])}`;
  d += " H94";
  const last = s.pts[s.pts.length - 1];
  return `<svg class="spark" viewBox="0 0 96 38" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="94" cy="${Y(last[1])}" r="3" fill="var(--drop)"/></svg>`;
}

function cupsFor(store) {
  const c = CUPS.find((k) => norm(k.l) === norm(store));
  if (!c) return { codes: [], pix: "" };
  return { codes: c.c.map((code, i) => ({ c: code, t: (c.t || [])[i] || "" })), pix: c.x || "" };
}

function ago(d) {
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 60) return `há ${Math.max(1, m)} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `há ${h} h`;
  const dd = Math.round(h / 24);
  return dd === 1 ? "ontem" : `há ${dd} dias`;
}

// Card da promoção: foto, preço e motivo à vista; o resto abre ao tocar
function bigCard(o, feat) {
  const ref = o.usual > o.p ? o.usual : o.prev && o.prev > o.p ? o.prev : 0; // mesma conta da análise
  const drop = o.bug ? `BUG −${o.pc}%` : ref ? `−${pct(ref, o.p)}%` : "Baixou";
  const img = o.i ? `<div class="pic"><span class="off${o.bug ? " bug" : ""}">${drop}</span>${o.at ? `<span class="ago">${ago(o.at)}</span>` : ""}${imgTag(o.i, "this.remove()")}</div>` : "";
  return `<article class="deal${feat ? " feat" : ""}">${img}<div class="body">
    ${who(o.b, o.store)}
    <p class="pname">${esc(o.n)}</p>
    ${o.notes?.length ? `<div class="tags">${o.notes.map((t) => `<span class="tag${/thyme/i.test(t) ? " thyme" : ""}">${esc(t.replace(/^\p{Extended_Pictographic}\s*/u, ""))}</span>`).join("")}</div>` : ""}
    ${pay(o.p, o.x, o.pi, o.store, ref)}
    ${o.bug ? `<div class="bugnote">BUG: queda de ${o.pc}% de uma vez, parece erro de preço da loja.</div>` : ""}
    ${o.v ? `<div class="verdict ${o.v.cls}"><b>${o.v.label}</b>${o.v.notes.length ? `<ul>${o.v.notes.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}</div>` : ""}
    ${!o.v && o.why?.length ? `<div class="why">${esc(o.why.join("; ").replace(/^./, (c) => c.toUpperCase()))}.</div>` : ""}
    ${o.todayTxt ? `<div class="today">${esc(o.todayTxt)}</div>` : ""}
    <details class="more"><summary>Detalhes e histórico ${CHEV}</summary>${facts(o, true)}${chart(o.h, o.p)}${o.when ? `<div class="note">${esc(o.when)}</div>` : ""}</details>
    <div class="acts"><a class="btn pri" href="${esc(o.u)}" target="_blank" rel="noopener">Ver na loja ${EXT}</a><button class="btn" data-cmp="${esc(o.n)}">${CMP}Comparar lojas</button></div>
  </div></article>`;
}

// produto da lista vira card completo
function fromItem(r) {
  const h = r.h || [];
  const prevs = h.slice(0, -1).map((q) => q[1]);
  const c = cupsFor(r.store);
  return {
    n: r.n, b: r.b, u: r.u, i: r.i, store: r.l, p: r.p, x: r.x, pi: r.pi, lp: r.d, h, notes: r.o || [],
    prev: h.length > 1 ? h[h.length - 2][1] : 0, usual: r.q, prevMin: prevs.length ? Math.min(...prevs) : 0,
    min: r.m, max: r.c, since: r.s, changes: Math.max(0, h.length - 1), coupons: c.codes, pixTxt: c.pix,
    lastWarn: r.w ? `${new Date(r.w + "T12:00:00Z").toLocaleDateString("pt-BR")}${r.z ? ` a ${brl(r.z)}` : ""}` : "",
  };
}

// Promoção que ainda vale: produto com estoque e preço de hoje igual ou menor que o avisado
function stillOn(x) {
  const item = BYURL.get(x.u);
  return item && item.a && item.p <= x.p + 0.01;
}

// ---------- Análise: vale muito a pena, vale, desconto pequeno, já acabou ----------
// Compara o preço avisado com o que o produto costumava custar (média de 30 dias ou preço anterior),
// não com o "de" da loja, que muitas vezes é inflado.
const VERDICTS = [
  { k: "v1", label: "Vale muito a pena", color: "var(--thyme)" },
  { k: "v2", label: "Vale a pena", color: "#9bb06f" },
  { k: "v3", label: "Desconto pequeno", color: "var(--mute)" },
  { k: "v4", label: "Já acabou", color: "var(--line)" },
  { k: "vb", label: "Pode ser erro de preço", color: "var(--bug)" },
];
let vfilter = "";
function analyze(list) {
  // liquidação: muitas peças da mesma loja com o mesmo desconto na mesma hora
  const wave = {};
  for (const x of list) { const k = `${x.l}|${x.t.slice(0, 13)}|${x.pc || 0}`; wave[k] = (wave[k] || 0) + 1; }
  for (const x of list) {
    const item = BYURL.get(x.u);
    const ref = x.q > x.p ? x.q : x.e > x.p ? x.e : 0;
    const real = ref ? Math.round((1 - x.p / ref) * 100) : x.pc || 0;
    const lowest = x.m && x.p <= x.m + 0.01;
    const notes = [];
    if (ref) notes.push(`${real}% abaixo do que costumava custar (${brl(ref)})`);
    if (lowest && x.c > x.m) notes.push("Menor preço desde que o robô acompanha");
    const shown = x.d > x.p ? Math.round((1 - x.p / x.d) * 100) : 0;
    if (ref && x.d >= ref * 1.4 && shown - real >= 15) notes.push(`O "de" da loja (${brl(x.d)}) está inflado: o site mostra −${shown}%, mas o desconto real é ${real}%`);
    const n = wave[`${x.l}|${x.t.slice(0, 13)}|${x.pc || 0}`];
    if (n >= 8) notes.push(`Liquidação da loja: ${n} peças com o mesmo desconto ao mesmo tempo`);
    let k;
    const ended = !(item && item.a && item.p <= x.p + 0.01);
    if (ended) {
      k = "v4";
      notes.unshift(!item ? "Saiu do site da loja" : !item.a ? "Acabou o estoque" : `Voltou a subir: hoje ${brl(item.p)}`);
    } else if (x.bug) {
      k = "vb";
      notes.unshift("Queda grande demais de uma vez; a loja pode cancelar o pedido");
    } else if (real >= 35 || (real >= 25 && lowest)) k = "v1";
    else if (real >= 20 && !(n >= 8 && real < 25)) k = "v2";
    else {
      k = "v3";
      notes.push(n >= 8 ? "É o desconto padrão da liquidação, não uma queda especial desta peça" : "Menos de 20% abaixo do normal: dá para esperar uma queda maior");
    }
    if (!ended && item && item.p < x.p - 0.01) notes.unshift(`Baixou mais desde o aviso: hoje ${brl(item.p)}`);
    const V = VERDICTS.find((v) => v.k === k);
    x.v = { k, cls: k, label: V.label, notes: notes.slice(0, 3) };
  }
}
function panel(list) {
  const count = Object.fromEntries(VERDICTS.map((v) => [v.k, 0]));
  for (const x of list) count[x.v.k]++;
  const chips = [["", "Todas", list.length, ""], ...VERDICTS.filter((v) => count[v.k]).map((v) => [v.k, v.label, count[v.k], v.color])]
    .map(([k, l, n, c]) => `<button class="chip" data-v="${k}" aria-pressed="${k === vfilter}">${c ? `<i class="dot" style="background:${c}"></i>` : ""}${l}<small>${n}</small></button>`).join("");
  const bf = new Date(Date.UTC(new Date().getFullYear(), 10, 1));
  bf.setUTCDate(1 + ((5 - bf.getUTCDay() + 7) % 7) + 21); // 4ª sexta de novembro
  const daysBF = Math.ceil((bf - Date.now()) / 86400000);
  const tip = daysBF >= 0 && daysBF <= 10
    ? `<p class="tip">Black Friday é ${bf.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", timeZone: "UTC" })}${daysBF ? `, daqui a ${daysBF} ${daysBF === 1 ? "dia" : "dias"}` : ", hoje"}. "Desconto pequeno" costuma valer a pena esperar; "Vale muito a pena" com estoque é melhor não deixar passar.</p>`
    : "";
  return `<div class="panel"><div class="vchips" id="vchips">${chips}</div>${tip}
    <details><summary>Como a análise decide</summary><ul>
      <li>Compara com o que o produto costumava custar no robô (média de 30 dias ou preço anterior), não com o "de" da loja.</li>
      <li><b>Vale muito a pena</b>: 35% ou mais abaixo do normal, ou 25% ou mais e no menor preço já visto.</li>
      <li><b>Vale a pena</b>: de 20% a 34% abaixo do normal.</li>
      <li><b>Desconto pequeno</b>: menos de 20%, ou o mesmo desconto de uma liquidação da loja inteira (abaixo de 25%).</li>
      <li><b>Já acabou</b>: voltou a subir, acabou o estoque ou saiu do site.</li>
      <li>O robô acompanha os preços desde ${day(Math.min(...list.map((x) => x.f || TODAY())))}. Com pouco tempo de histórico, o "normal" ainda pode mudar.</li>
    </ul></details></div>`;
}

function fromPromo(x) {
  const item = BYURL.get(x.u);
  const when = new Date(x.t);
  return {
    v: x.v, bug: x.bug, pc: x.pc, at: when, why: x.y, n: x.n, b: x.b, u: x.u, i: x.i, store: x.l, p: x.p, x: x.x, pi: x.pi || item?.pi, lp: x.d,
    prev: x.e, usual: x.q, prevMin: x.r, min: x.m, max: x.c, since: x.f, changes: x.g, notes: x.o || [],
    coupons: (x.cp || []).map((k) => ({ c: k.c, t: k.t })), pixTxt: x.cx, h: item?.h,
    todayTxt: item && item.p !== x.p ? `Hoje está ${brl(item.p)}${item.a ? "" : ", sem estoque"}` : item && !item.a ? "Hoje sem estoque" : "",
    when: `Avisado em ${when.toLocaleDateString("pt-BR")} às ${when.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`,
  };
}

function drawPromo() {
  const words = norm($("q").value).split(/\s+/).filter(Boolean);
  $("clear").hidden = !words.length;
  const on = tab === "ativas";
  const base = on ? ACTIVE : PROMOS;
  const all = base.filter((x) => (!brand || x.b === brand) && words.every((w) => norm(`${x.n} ${x.b} ${x.l}`).includes(w)));
  if (vfilter && !all.some((x) => x.v.k === vfilter)) vfilter = "";
  // melhores primeiro (vale muito, possível erro, vale, pequeno, acabou); dentro de cada grupo, a mais nova
  const RANK = { v1: 0, vb: 1, v2: 2, v3: 3, v4: 4 };
  const list = (vfilter ? all.filter((x) => x.v.k === vfilter) : all.slice()).sort((a, b) => RANK[a.v.k] - RANK[b.v.k] || b.t.localeCompare(a.t));
  const n = list.length, inBrand = brand ? ` em ${esc(brand)}` : "";
  const head = on
    ? `<div class="head"><div><h2>${n ? `${n} ${n === 1 ? "promoção ainda valendo" : "promoções ainda valendo"}` : "Ainda valendo"}${inBrand}</h2>
      <p>Quedas de preço dos últimos 14 dias que continuam com o mesmo preço ou mais barato hoje, e com estoque.</p></div></div>`
    : `<div class="head"><div><h2>${n ? `${n} ${n === 1 ? "queda de preço" : "quedas de preço"}` : "Promoções"}${inBrand}</h2>
      <p>Tudo o que o robô avisou no Telegram nos últimos 14 dias, com a análise de cada uma. As que mais valem a pena vêm primeiro.</p></div></div>`;
  const empty = on
    ? `<b>Nenhuma promoção${brand ? ` de ${esc(brand)}` : ""} ainda valendo</b>As quedas avisadas já voltaram ao preço normal ou acabaram no estoque. Veja o histórico em Promoções.`
    : `<b>Nenhuma queda de preço${brand ? ` de ${esc(brand)}` : ""} nos últimos 14 dias</b>Quando o robô avisar no Telegram, aparece aqui também. Para ver os preços de hoje, abra Produtos.`;
  $("vpromo").innerHTML = head + (all.length ? panel(all) : "") + (n
    ? `<div class="promos">${list.map((x, i) => bigCard(fromPromo(x), i === 0 && !words.length)).join("")}</div>`
    : `<div class="promos"><div class="empty">${empty}</div></div>`);
}
$("vpromo").addEventListener("click", (e) => {
  const b = e.target.closest("[data-v]"); if (!b) return;
  vfilter = b.dataset.v; drawPromo();
});

// ---------- Passagens aéreas ----------
let VOOS = [], VOOSON = false, vOrig = "";
const dmy = (iso) => (iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : "");
const hm = (m) => (m ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}` : "");
const stops = (n) => (n ? `${n} ${n === 1 ? "escala" : "escalas"}` : "direto");
const MES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
function voo(v) {
  const usualDrop = v.mx > v.p ? pct(v.mx, v.p) : 0;
  const tags = [];
  if (v.lm) tags.push(`<span class="tag thyme">💍 Lua de mel</span>`);
  if (v.mx > v.mn && v.p <= v.mn) tags.push(`<span class="tag good">Menor preço já visto</span>`);
  if (!v.tr && (!v.ret || !v.rtr)) tags.push(`<span class="tag">Voo direto</span>`);
  const F = [];
  const row = (k, x) => F.push(`<dt>${k}</dt><dd>${x}</dd>`);
  row("Companhia", esc(v.al));
  row("Ida", `${dmy(v.dep)}, ${stops(v.tr)}${v.du ? `, ${hm(v.du)}` : ""}`);
  if (v.ret) row("Volta", `${dmy(v.ret)}, ${stops(v.rtr)}${v.db ? `, ${hm(v.db)}` : ""}`);
  row("Bagagem", "não informada pela fonte; confira na tarifa");
  row(`Desde ${day(v.s)}`, v.mx > v.mn ? `${brl(v.mn)} a ${brl(v.mx)}` : brl(v.p));
  if (v.w) row("Último aviso", `${new Date(v.w + "T12:00:00Z").toLocaleDateString("pt-BR")}${v.z ? ` a ${brl(v.z)}` : ""}`);
  return `<article class="deal flt"><div class="body">
    <div class="who"><b>${esc(v.al)}</b><span>saindo de ${esc(v.on)} · ${MES[+v.m.slice(5, 7) - 1]} de ${v.m.slice(0, 4)}</span></div>
    <p class="route">${esc(v.dn)} <span>${esc(v.d)}</span></p>
    <div class="dates">Ida ${dmy(v.dep)}${v.ret ? ` · volta ${dmy(v.ret)}` : ""}</div>
    <div class="pay"><div class="now">${brl(v.p)}</div><div class="paylbl">ida e volta, por pessoa, econômica · casal ${brl(v.p * 2)}</div><div class="paylbl">Preço do Aviasales</div>${usualDrop ? `<div class="was">já esteve ${brl(v.mx)}</div>` : ""}</div>
    ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
    <details class="more"><summary>Detalhes e histórico ${CHEV}</summary><dl class="facts">${F.join("")}</dl>${chart(v.h, v.p)}<div class="note">Esse preço está no Aviasales (buscas das últimas 48 h; pode ter mudado). Para conferir: Google Voos${safeUrl(v.c) ? ` ou o <a href="${esc(safeUrl(v.c))}" target="_blank" rel="noopener">site da ${esc(v.al)}</a>` : ""}.</div></details>
    <div class="acts">${v.u ? `<a class="btn pri" href="${esc(v.u)}" target="_blank" rel="noopener">Ver no Aviasales ${EXT}</a>` : ""}<a class="btn" href="${esc(v.g)}" target="_blank" rel="noopener">Google Voos ${EXT}</a></div>
  </div></article>`;
}
function drawVoos() {
  const words = norm($("q").value).split(/s+/).filter(Boolean);
  $("clear").hidden = !words.length;
  const origins = [...new Map(VOOS.map((v) => [v.o, v.on])).entries()];
  const list = VOOS.filter((v) => (!vOrig || v.o === vOrig) && words.every((w) => norm(`${v.dn} ${v.d} ${v.dg} ${v.on} ${v.o} ${v.al}`).includes(w)));
  // por destino, só a viagem mais barata (os outros meses ficam no filtro de busca)
  const best = new Map();
  for (const v of list.filter((x) => !x.lm || words.length)) { const k = vOrig ? `${v.o}|${v.d}` : v.d; if (!best.has(k) || best.get(k).p > v.p) best.set(k, v); }
  const show = words.length ? list : [...best.values(), ...list.filter((v) => v.lm && !best.get(vOrig ? `${v.o}|${v.d}` : v.d)?.lm).sort((a, b) => a.p - b.p).slice(0, 1)];
  show.sort((a, b) => (b.lm || 0) - (a.lm || 0) || a.p - b.p);
  const sel = origins.length > 1 ? `<div class="tools"><select id="vorig" aria-label="Saindo de"><option value="">Saindo de todos</option>${origins.map(([c, n]) => `<option value="${esc(c)}"${c === vOrig ? " selected" : ""}>Saindo de ${esc(n)}</option>`).join("")}</select></div>` : "";
  const head = `<div class="head"><div><h2>${show.length ? `${show.length} ${show.length === 1 ? "destino" : "destinos"}` : "Passagens"}</h2>
    <p>Orlando, Bahamas, Roma e Europa até agosto de 2027: ida e volta mais barata por pessoa, só companhias tradicionais (sem low cost). Buscando uma cidade, aparecem todas as saídas. Queda de preço vai para o Telegram.</p></div>${sel}</div>`;
  const empty = !VOOSON
    ? `<b>Passagens ainda não ligadas</b>Falta a chave grátis da Travelpayouts no GitHub. Assim que ela entrar, as rotas aparecem aqui em até 1 hora.`
    : `<b>Nenhuma rota encontrada</b>${words.length ? "Tente outra cidade." : "A primeira leitura sai em até 1 hora."}`;
  $("vvoos").innerHTML = head + `<div class="promos">${show.length ? show.map(voo).join("") : `<div class="empty">${empty}</div>`}</div>`;
}
$("vvoos").addEventListener("change", (e) => { if (e.target.id === "vorig") { vOrig = e.target.value; drawVoos(); } });

function setTab(tt) {
  tab = tt;
  document.body.classList.toggle("voos", tt === "voos");
  $("vvoos").hidden = tt !== "voos";
  $("q").placeholder = tt === "voos" ? "Buscar cidade de destino" : "Buscar produto, marca ou loja";
  for (const b of document.querySelectorAll(".seg button")) b.setAttribute("aria-selected", String(b.dataset.tab === tt));
  $("vpromo").hidden = tt === "todos" || tt === "voos";
  for (const el of document.querySelectorAll(".view-todos")) el.hidden = tt !== "todos";
  drawTab();
  try { localStorage.setItem("cp-tab", tt); } catch {}
}
function drawTab() {
  if (!ALL.length) return;
  if (tab === "voos") drawVoos();
  else if (tab !== "todos") drawPromo();
  else render();
}
document.querySelector(".seg").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]"); if (b) { setTab(b.dataset.tab); window.scrollTo({ top: 0 }); }
});
// filtros abertos em tela larga, fechados no celular
if (matchMedia("(min-width:980px)").matches) $("filters").open = true;

try { const saved = localStorage.getItem("cp-tab"); if (["promo", "ativas", "todos", "voos"].includes(saved)) setTab(saved); } catch {}
load();
</script>
</body>
</html>
