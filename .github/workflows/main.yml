
name: Casa Premium

on:
  workflow_dispatch:
    inputs:
      test_only:
        description: "Testar somente o Telegram"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: casa-premium
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar histórico
        uses: actions/cache@v4
        with:
          path: prices.sqlite3
          key: casa-premium-${{ github.run_id }}
          restore-keys: |
            casa-premium-

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only || false }}
        run: python bot.py
