name: Casa Premium

on:
  # toda atualização do bot roda uma consulta completa
  push:
    branches: [main]
    paths: ["bot.mjs", ".github/workflows/main.yml"]
  workflow_dispatch:
    inputs:
      resumo:
        description: "Mandar o resumo do dia agora"
        required: true
        type: boolean
        default: true
      test_only:
        description: "Só mandar um alerta de exemplo (não consulta as lojas)"
        required: true
        type: boolean
        default: false
  schedule:
    # reserva: o GitHub atrasa/pula agendamentos curtos. Quem mantém o ritmo é a corrente
    # (cada rodada dispara a próxima no fim). Se a corrente parar, isto religa.
    - cron: "*/30 * * * *"

permissions:
  contents: write # publica a lista de produtos do site no ramo "dados"
  actions: write # para uma rodada disparar a próxima

concurrency:
  group: casa-premium
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Marcar início
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restaurar histórico de preços
        uses: actions/cache/restore@v4
        with:
          path: state.json.gz
          key: casa-premium-state-${{ github.run_id }}
          restore-keys: |
            casa-premium-state-

      - name: Consultar lojas e avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only }}
          DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.resumo }}
          # Smeg e Lazer Shop bloqueiam os servidores do GitHub: rodam no PC (casapremium-local)
          SKIP: smeg,lazershop
          CATALOG_FILE: catalogo.json
        run: node bot.mjs

      - name: Publicar lista de produtos para o site
        if: hashFiles('catalogo.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dados && cp catalogo.json /tmp/dados/
          cd /tmp/dados
          git init -q -b dados
          git add catalogo.json
          git -c user.name="casa-premium-bot" -c user.email="bot@users.noreply.github.com" commit -qm "lista de produtos"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dados

      - name: Guardar histórico de preços
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json.gz
          key: casa-premium-state-${{ github.run_id }}

      - name: Disparar a próxima rodada (~5 min depois do início desta)
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.test_only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          espera=$(( 300 - ($(date +%s) - START) ))
          if [ "$espera" -gt 0 ]; then sleep "$espera"; fi
          gh workflow run main.yml --repo "${{ github.repository }}" --ref main -f resumo=false -f test_only=false
