name: Casa Premium

on:
  # toda atualização do bot manda um alerta de teste no Telegram
  push:
    branches: [main]
    paths: ["bot.mjs", ".github/workflows/main.yml"]
  workflow_dispatch:
    inputs:
      test_only:
        description: "Só testar o envio do Telegram"
        required: true
        type: boolean
        default: false
  schedule:
    # a cada 10 minutos (o GitHub pode atrasar alguns minutos em horário de pico)
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: casa-premium
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restaurar histórico de preços
        uses: actions/cache/restore@v4
        with:
          path: state.json.gz
          key: casa-premium-state-${{ github.run_id }}
          restore-keys: |
            casa-premium-state-

      - name: Consultar lojas e avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ONLY: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test_only) }}
        run: node bot.mjs

      - name: Guardar histórico de preços
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json.gz
          key: casa-premium-state-${{ github.run_id }}
